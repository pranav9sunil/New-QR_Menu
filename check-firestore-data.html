<!DOCTYPE html>
<html>

<head>
    <title>Check Firestore Data</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAT2acMkrTKsMMaW2aR5aGLTMdYQbje7i8",
            authDomain: "qr-ordering-system-c80d4.firebaseapp.com",
            projectId: "qr-ordering-system-c80d4",
            storageBucket: "qr-ordering-system-c80d4.firebasestorage.app",
            messagingSenderId: "380518528753",
            appId: "1:380518528753:web:4893e0ed933138b5f99b50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function checkData() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Checking Firestore data...</p>';

            try {
                // Check restaurants
                const restaurantsSnap = await getDocs(collection(db, 'restaurants'));
                output.innerHTML += `<h3>Restaurants: ${restaurantsSnap.size}</h3>`;
                restaurantsSnap.forEach(doc => {
                    output.innerHTML += `<p>ID: ${doc.id}, Name: ${doc.data().name}</p>`;
                });

                // Check tables
                const tablesSnap = await getDocs(collection(db, 'tables'));
                output.innerHTML += `<h3>Tables: ${tablesSnap.size}</h3>`;
                tablesSnap.forEach(doc => {
                    const data = doc.data();
                    output.innerHTML += `<p>ID: ${doc.id}, Name: ${data.name}, Restaurant: ${data.restaurantId}</p>`;
                });

                // Check users
                const usersSnap = await getDocs(collection(db, 'users'));
                output.innerHTML += `<h3>Users: ${usersSnap.size}</h3>`;
                usersSnap.forEach(doc => {
                    const data = doc.data();
                    output.innerHTML += `<p>Email: ${data.email}, Restaurant: ${data.restaurantId}</p>`;
                });

            } catch (error) {
                output.innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }

        window.addEventListener('load', checkData);
    </script>
</head>

<body>
    <h1>Firestore Data Check</h1>
    <div id="output"></div>
</body>

</html>
